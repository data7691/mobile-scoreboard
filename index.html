<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#090b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="記分板" />
  <link rel="manifest" href="manifest.json" />
  <title>橫向手機記分板</title>
  
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --safe-t:env(safe-area-inset-top,0px);
      --safe-r:env(safe-area-inset-right,0px);
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-l:env(safe-area-inset-left,0px);
    }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      min-width:100%;
      max-width:100%;
      background:#05070a;
      color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
      overflow:hidden;
      overscroll-behavior:none;
    }
    body{
      position:fixed;
      inset:0;
      width:100%;
      height:100dvh;
    }
    button,input{font:inherit}
    button{border:none;color:#fff;cursor:pointer;touch-action:manipulation}
    .app{
      width:100%;
      max-width:100%;
      height:100dvh;
      display:grid;
      grid-template-rows:minmax(54px,10vh) minmax(0,1fr) minmax(70px,13vh);
      gap:7px;
      padding:
        max(6px,var(--safe-t))
        max(8px,var(--safe-r))
        max(6px,var(--safe-b))
        max(8px,var(--safe-l));
      overflow:hidden;
      background:
        radial-gradient(ellipse at 50% -15%,rgba(187,141,31,.18),transparent 34%),
        radial-gradient(ellipse at 13% 55%,rgba(0,101,255,.08),transparent 35%),
        radial-gradient(ellipse at 87% 55%,rgba(255,0,20,.08),transparent 35%),
        linear-gradient(180deg,#101215 0%,#07090c 52%,#040608 100%);
    }
    .topbar{
      min-width:0;
      display:flex;
      align-items:center;
      gap:clamp(5px,1vw,12px);
      padding:6px 10px;
      border:1px solid #32363d;
      border-radius:18px;
      background:linear-gradient(180deg,rgba(26,29,34,.98),rgba(11,13,17,.98));
      box-shadow:inset 0 0 0 1px #000,0 4px 20px #0008;
      overflow:hidden;
    }
    .title{
      flex:0 0 auto;
      font-weight:1000;
      font-size:clamp(16px,2vw,28px);
      white-space:nowrap;
    }
    .pricebox{
      flex:0 1 auto;
      min-width:0;
      display:flex;
      align-items:center;
      gap:5px;
      background:linear-gradient(180deg,#17130a,#0d0c08);
      border:1px solid #745c18;
      border-radius:13px;
      padding:3px 7px;
      box-shadow:inset 0 0 18px #b47b0022;
    }
    .pricebox label{
      font-weight:900;
      color:#ffe59a;
      font-size:clamp(13px,1.5vw,20px);
      white-space:nowrap;
    }
    .pricebox input{
      width:clamp(58px,7vw,90px);
      min-width:0;
      background:#090b0e;
      border:1px solid #705a1a;
      color:#fff;
      border-radius:9px;
      padding:5px 4px;
      font-size:clamp(17px,2vw,26px);
      font-weight:1000;
      text-align:center;
    }
    .spacer{flex:1 1 10px;min-width:0}
    .topbtn{
      flex:0 0 auto;
      height:clamp(38px,7vh,52px);
      padding:0 clamp(8px,1.2vw,16px);
      border-radius:13px;
      background:linear-gradient(#30353d,#171a1f);
      border:1px solid #4b535e;
      font-weight:900;
      font-size:clamp(12px,1.35vw,18px);
      white-space:nowrap;
    }
    .topbtn.active{
      outline:2px solid #5cff89;
      background:linear-gradient(#216b39,#12351f);
      box-shadow:0 0 16px #35ff6d55;
    }
    .topbtn.danger{
      border-color:#8b3131;
      background:linear-gradient(#552323,#251011);
    }

    .boards{
      min-width:0;
      min-height:0;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:7px;
      overflow:hidden;
    }
    .panel{
      --accent:#fff;
      --glow:#fff3;
      --shade1:#101010;
      --shade2:#050505;
      position:relative;
      min-width:0;
      min-height:0;
      border-radius:22px;
      padding:clamp(7px,1vw,14px);
      display:grid;
      grid-template-rows:auto auto minmax(0,1fr) auto auto;
      gap:clamp(4px,.7vh,9px);
      overflow:hidden;
      isolation:isolate;
      border:2px solid var(--accent);
      background:
        radial-gradient(circle at 50% 0%,rgba(255,255,255,.045),transparent 35%),
        linear-gradient(180deg,var(--shade1),var(--shade2));
      box-shadow:
        0 0 22px var(--glow),
        inset 0 0 42px rgba(0,0,0,.62);
    }
    /* Brush-circle / dragon-watermark layer: closer to the original preview */
    .panel::before{
      content:"龍";
      position:absolute;
      z-index:-1;
      left:-3%;
      bottom:-18%;
      width:70%;
      height:110%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"STKaiti","KaiTi","Noto Serif TC",serif;
      font-size:clamp(150px,24vw,390px);
      font-weight:900;
      line-height:1;
      color:var(--accent);
      opacity:.055;
      transform:rotate(-13deg);
      filter:blur(.2px);
      text-shadow:
        0 0 22px var(--accent),
        0 0 55px var(--accent);
      pointer-events:none;
    }
    .panel::after{
      content:"";
      position:absolute;
      z-index:-1;
      inset:8% 8%;
      border-radius:50%;
      border:clamp(10px,1.3vw,20px) solid var(--accent);
      opacity:.035;
      transform:rotate(-18deg) scale(1.08,.78);
      box-shadow:0 0 36px var(--accent);
      pointer-events:none;
    }
    .left{
      --accent:#1687ff;
      --glow:#005ccf88;
      --shade1:#071426;
      --shade2:#020913;
    }
    .front{
      --accent:#d9aa32;
      --glow:#b77d0088;
      --shade1:#241a05;
      --shade2:#0d0902;
    }
    .right{
      --accent:#ff3b3b;
      --glow:#c1000088;
      --shade1:#290708;
      --shade2:#100203;
    }
    .name{
      min-width:0;
      font-family:"STKaiti","KaiTi","Noto Serif TC",serif;
      font-size:clamp(38px,5.8vw,78px);
      font-weight:1000;
      line-height:.95;
      color:var(--accent);
      text-shadow:0 0 20px var(--glow);
      text-align:center;
    }
    .row{
      min-width:0;
      display:grid;
      grid-template-columns:minmax(58px,26%) minmax(25px,1fr) minmax(40px,14%) minmax(40px,14%);
      align-items:center;
      gap:clamp(4px,.6vw,8px);
      margin-top:4px;
    }
    .row .label{
      height:clamp(37px,7vh,50px);
      min-width:0;
      border:1px solid var(--accent);
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:clamp(13px,1.5vw,20px);
      background:#0d1015dd;
      white-space:nowrap;
    }
    .count{
      min-width:0;
      font-size:clamp(20px,2.7vw,34px);
      font-weight:1000;
      text-align:center;
    }
    .mini{
      min-width:0;
      height:clamp(37px,7vh,50px);
      border-radius:13px;
      font-size:clamp(24px,3vw,38px);
      font-weight:1000;
      background:linear-gradient(#39414b,#171a1f);
      border:1px solid #58616e;
      box-shadow:inset 0 1px 0 #ffffff22;
    }
    .amount{
      min-width:0;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(46px,7.3vw,100px);
      font-weight:1000;
      text-shadow:0 0 24px var(--glow);
      letter-spacing:1px;
    }
    .bigrow{
      min-width:0;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
    }
    .big{
      min-width:0;
      height:clamp(46px,8vh,70px);
      border-radius:15px;
      font-size:clamp(28px,4vw,44px);
      font-weight:1000;
      border:1px solid #565e68;
      background:linear-gradient(#3a4048,#1b1e23);
    }
    .big.plus{background:linear-gradient(#1687ff,#0b4b90)}
    .front .big.plus{background:linear-gradient(#d6a52e,#7c5510)}
    .right .big.plus{background:linear-gradient(#ff4242,#932020)}
    .clear-one{
      min-width:0;
      height:clamp(30px,5vh,42px);
      border-radius:11px;
      font-size:clamp(11px,1.25vw,16px);
      font-weight:900;
      background:linear-gradient(#252a31,#11151a);
      border:1px solid var(--accent);
      color:#fff;
      opacity:.96;
    }

    .footer{
      min-width:0;
      display:grid;
      grid-template-columns:minmax(0,1.65fr) minmax(0,.85fr);
      gap:7px;
      overflow:hidden;
    }
    .summary{
      min-width:0;
      border-radius:18px;
      border:1px solid #394049;
      background:linear-gradient(#11151a,#0a0d11);
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      align-items:center;
      padding:5px 10px;
    }
    .sumitem{min-width:0;text-align:center}
    .sumitem .sname{
      font-weight:900;
      color:#aeb7c1;
      font-size:clamp(11px,1.35vw,18px);
    }
    .sumitem .sval{
      font-size:clamp(20px,2.8vw,38px);
      font-weight:1000;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .grand{
      min-width:0;
      border-radius:18px;
      border:1px solid #206f36;
      background:
        radial-gradient(circle at 50% 50%,#164a26,#09140d 68%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 0 28px #2aff5822;
    }
    .grand small{
      font-weight:900;
      color:#bdf8c8;
      font-size:clamp(11px,1.2vw,17px);
    }
    .grand strong{
      max-width:100%;
      font-size:clamp(27px,4vw,52px);
      line-height:1;
      color:#77ff8d;
      text-shadow:0 0 18px #42ff6e88;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .rotateHint{
      display:none;
      position:fixed;
      inset:0;
      z-index:99;
      background:#05070a;
      color:#fff;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:30px;
      font-size:28px;
      font-weight:900;
    }

    @media (orientation:portrait){
      .rotateHint{display:flex}
    }

    /* iPhone landscape / short-height tuning */
    @media (max-height:500px){
      .app{
        grid-template-rows:52px minmax(0,1fr) 62px;
        gap:5px;
        padding:
          max(4px,var(--safe-t))
          max(6px,var(--safe-r))
          max(4px,var(--safe-b))
          max(6px,var(--safe-l));
      }
      .topbar{border-radius:15px;padding:4px 7px}
      .pricebox{padding:2px 5px}
      .topbtn{height:38px}
      .panel{border-radius:17px;padding:6px;gap:3px}
      .name{font-size:34px}
      .row{margin-top:2px}
      .row .label,.mini{height:32px}
      .amount{font-size:42px}
      .big{height:38px}
      .clear-one{height:27px}
      .footer{gap:5px}
      .summary,.grand{border-radius:14px}
    }

    /* Very narrow landscape screens: hide long labels before allowing any overflow */
    @media (max-width:750px){
      .title{font-size:15px}
      .topbtn{padding:0 7px;font-size:11px}
      .pricebox label{font-size:12px}
      .pricebox input{width:54px;font-size:16px}
    }
  </style>

</head>
<body>
  <div class="rotateHint">請將手機旋轉為橫向使用記分板</div>

  <main class="app">
    <header class="topbar">
      <div class="title">記分板</div>

      <div class="pricebox">
        <label>一底</label>
        <input id="basePrice" type="number" min="0" step="50" value="200">
      </div>

      <div class="pricebox">
        <label>一台</label>
        <input id="taiPrice" type="number" min="0" step="10" value="50">
      </div>

      <div class="spacer"></div>

      <button class="topbtn" id="wakeBtn">螢幕常亮</button>
      <button class="topbtn" id="fsBtn">全螢幕</button>
      <button class="topbtn danger" id="resetBtn">全部重置</button>
    </header>

    <section class="boards">
      <article class="panel left" data-player="left">
        <div class="name">左</div>
        <div>
          <div class="row">
            <div class="label">底數</div>
            <div class="count" data-kind="base">0</div>
            <button class="mini" data-action="dec-base">−</button>
            <button class="mini" data-action="inc-base">＋</button>
          </div>
          <div class="row">
            <div class="label">台數</div>
            <div class="count" data-kind="tai">0</div>
            <button class="mini" data-action="dec-tai">−</button>
            <button class="mini" data-action="inc-tai">＋</button>
          </div>
        </div>
        <div class="amount" data-role="amount">0</div>
        <div class="bigrow">
          <button class="big" data-action="minus-round">−</button>
          <button class="big plus" data-action="plus-round">＋</button>
        </div>
        <button class="clear-one" data-action="clear-player">單獨清除</button>
      </article>

      <article class="panel front" data-player="front">
        <div class="name">前</div>
        <div>
          <div class="row">
            <div class="label">底數</div>
            <div class="count" data-kind="base">0</div>
            <button class="mini" data-action="dec-base">−</button>
            <button class="mini" data-action="inc-base">＋</button>
          </div>
          <div class="row">
            <div class="label">台數</div>
            <div class="count" data-kind="tai">0</div>
            <button class="mini" data-action="dec-tai">−</button>
            <button class="mini" data-action="inc-tai">＋</button>
          </div>
        </div>
        <div class="amount" data-role="amount">0</div>
        <div class="bigrow">
          <button class="big" data-action="minus-round">−</button>
          <button class="big plus" data-action="plus-round">＋</button>
        </div>
        <button class="clear-one" data-action="clear-player">單獨清除</button>
      </article>

      <article class="panel right" data-player="right">
        <div class="name">右</div>
        <div>
          <div class="row">
            <div class="label">底數</div>
            <div class="count" data-kind="base">0</div>
            <button class="mini" data-action="dec-base">−</button>
            <button class="mini" data-action="inc-base">＋</button>
          </div>
          <div class="row">
            <div class="label">台數</div>
            <div class="count" data-kind="tai">0</div>
            <button class="mini" data-action="dec-tai">−</button>
            <button class="mini" data-action="inc-tai">＋</button>
          </div>
        </div>
        <div class="amount" data-role="amount">0</div>
        <div class="bigrow">
          <button class="big" data-action="minus-round">−</button>
          <button class="big plus" data-action="plus-round">＋</button>
        </div>
        <button class="clear-one" data-action="clear-player">單獨清除</button>
      </article>
    </section>

    <footer class="footer">
      <div class="summary">
        <div class="sumitem"><div class="sname">左</div><div class="sval" id="sum-left">0</div></div>
        <div class="sumitem"><div class="sname">前</div><div class="sval" id="sum-front">0</div></div>
        <div class="sumitem"><div class="sname">右</div><div class="sval" id="sum-right">0</div></div>
      </div>
      <div class="grand"><small>總計</small><strong id="grandTotal">0</strong></div>
    </footer>
  </main>

<script>
const state = {
  left:{base:0,tai:0},
  front:{base:0,tai:0},
  right:{base:0,tai:0}
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const money = n => Number(n||0).toLocaleString('zh-TW');

function getPrices(){
  return {
    base: Number($('#basePrice').value || 0),
    tai: Number($('#taiPrice').value || 0)
  }
}
function amountFor(p){
  const price = getPrices();
  return state[p].base * price.base + state[p].tai * price.tai;
}
function render(){
  $$('.panel').forEach(panel=>{
    const p = panel.dataset.player;
    panel.querySelector('[data-kind="base"]').textContent = state[p].base;
    panel.querySelector('[data-kind="tai"]').textContent = state[p].tai;
    panel.querySelector('[data-role="amount"]').textContent = money(amountFor(p));
  });
  ['left','front','right'].forEach(p=>{
    $('#sum-'+p).textContent = money(amountFor(p));
  });
  $('#grandTotal').textContent = money(['left','front','right'].reduce((a,p)=>a+amountFor(p),0));
  localStorage.setItem('scoreboard-state', JSON.stringify({
    state,
    basePrice:$('#basePrice').value,
    taiPrice:$('#taiPrice').value
  }));
}
function load(){
  try{
    const x = JSON.parse(localStorage.getItem('scoreboard-state')||'null');
    if(!x) return;
    Object.assign(state.left,x.state?.left||{});
    Object.assign(state.front,x.state?.front||{});
    Object.assign(state.right,x.state?.right||{});
    if(x.basePrice!=null) $('#basePrice').value=x.basePrice;
    if(x.taiPrice!=null) $('#taiPrice').value=x.taiPrice;
  }catch(e){}
}

$$('.panel').forEach(panel=>{
  panel.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-action]');
    if(!btn) return;
    const p=panel.dataset.player;
    const a=btn.dataset.action;
    if(a==='inc-base') state[p].base++;
    if(a==='dec-base') state[p].base=Math.max(0,state[p].base-1);
    if(a==='inc-tai') state[p].tai++;
    if(a==='dec-tai') state[p].tai=Math.max(0,state[p].tai-1);

    // 大按鈕：一局快速加減一底
    if(a==='plus-round') state[p].base++;
    if(a==='minus-round') state[p].base=Math.max(0,state[p].base-1);

    if(a==='clear-player'){
      const label = p==='left' ? '左' : p==='front' ? '前' : '右';
      if(confirm(`確定要只清除「${label}」嗎？\n其他兩家不會被清除。`)){
        state[p].base = 0;
        state[p].tai = 0;
      }
    }

    render();
    ensureImmersive();
  });
});

$('#basePrice').addEventListener('input',render);
$('#taiPrice').addEventListener('input',render);

$('#resetBtn').addEventListener('click',()=>{
  if(confirm('確定要全部歸零嗎？')){
    Object.values(state).forEach(x=>{x.base=0;x.tai=0});
    render();
  }
  ensureImmersive();
});

// fullscreen
async function enterFullscreen(){
  try{
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
    }
  }catch(e){}
  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('landscape');
    }
  }catch(e){}
}
async function exitFullscreen(){
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
  }catch(e){}
}
$('#fsBtn').addEventListener('click',async()=>{
  if(document.fullscreenElement) await exitFullscreen();
  else await enterFullscreen();
  ensureImmersive();
});
document.addEventListener('fullscreenchange',()=>{
  $('#fsBtn').classList.toggle('active',!!document.fullscreenElement);
});

// wake lock
let wakeLock=null;
let wakeDesired=true;

async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    $('#wakeBtn').classList.add('active');
    $('#wakeBtn').textContent='常亮 ON';
    wakeLock.addEventListener('release',()=>{
      $('#wakeBtn').classList.remove('active');
      $('#wakeBtn').textContent='螢幕常亮';
    });
  }catch(e){}
}
async function releaseWakeLock(){
  wakeDesired=false;
  try{ if(wakeLock) await wakeLock.release(); }catch(e){}
  wakeLock=null;
  $('#wakeBtn').classList.remove('active');
  $('#wakeBtn').textContent='常亮 OFF';
}
$('#wakeBtn').addEventListener('click',async()=>{
  if(wakeDesired && wakeLock){
    await releaseWakeLock();
  }else{
    wakeDesired=true;
    await requestWakeLock();
  }
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && wakeDesired) requestWakeLock();
});

async function ensureImmersive(){
  if(wakeDesired) requestWakeLock();
  // browsers generally require a user gesture for fullscreen/orientation lock,
  // so the first interaction attempts it automatically.
  if(!document.fullscreenElement) await enterFullscreen();
}

document.addEventListener('pointerdown',()=>{
  ensureImmersive();
},{once:true});

load();
render();
requestWakeLock();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
